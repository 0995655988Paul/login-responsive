<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdminExpress | Sign in</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="login">
    <section class="brand" aria-label="AdminExpress">
      <h1>AdminExpress</h1>
    </section>
    <section class="form-panel" aria-labelledby="login-title">
      <div class="form-content">
        <h2 id="login-title">Let's <strong>Sign In</strong> 👇</h2>
        <p class="intro">Hey. Enter your details to get sign in<br>to your account.</p>

        <form action="#" method="get">
          <div class="field">
            <label for="email">Email</label>
            <div class="input-box">
              <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 6 9 7 9-7"/></svg>
              <input id="email" name="email" type="email" placeholder="Enter Email" autocomplete="email" required>
            </div>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="input-box">
              <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
              <input id="password" type="password" placeholder="Enter Password" autocomplete="current-password" required minlength="8">
              <svg class="eye" aria-hidden="true" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path d="m3 21 18-18"/></svg>
            </div>
          </div>

          <a class="forgot" href="#forgot">Forgot password?</a>
          <button type="submit">Sign In</button>
          <p class="signup">Don't have an account? <a href="#signup">Sign Up</a></p>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
